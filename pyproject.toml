[project]
name = "invoice-workspace"
version = "0.1.0"
description = "Check grant justification invoices with your own AI assistant."
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=4.30",
    "Pillow>=10.1",
    "openpyxl>=3.1",
    "tomlkit>=0.13,<1",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]
package = false
cache-dir = ".tools/cache"
